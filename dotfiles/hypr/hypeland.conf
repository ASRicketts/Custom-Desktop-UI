# Monitor setup (Dell XPS 13 9360 native display)
monitor=eDP-1,preferred,auto,1

# Startup Daemons
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = swww-daemon

# Environment Variables
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(e93fff) rgb(00f5ff) 45deg
    col.inactive_border = rgba(1a3461aa)
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
    }
    
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(0c0e12cc)
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 6, myBezier
    animation = border, 1, 8, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, default
}

# Window Rules
# windowrulev2 = opacity 0.85 0.85,class:^(kitty)$
# windowrulev2 = float,class:^(obsidian)$
# windowrulev2 = size 1000 650,class:^(obsidian)$
# windowrulev2 = float,title:^(Pear Desktop|Pear Music)$
# windowrulev2 = size 420 600,title:^(Pear Desktop|Pear Music)$

# Keybindings
$mainMod = SUPER
bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, rofi -show drun
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Media & Volume controls
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl = , XF86AudioPlay, exec, playerctl play-pause
