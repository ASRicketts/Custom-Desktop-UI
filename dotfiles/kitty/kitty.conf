#!/bin/bash
# SRE, DevOps, and Local AI Provisioning Script

echo "Starting deployment..."

# 1. Update system and install core utilities
sudo pacman -Syu --noconfirm
sudo pacman -S --noconfirm zsh git curl wget fastfetch btop zram-generator base-devel

# 2. Install DevOps Stack and Ollama
sudo pacman -S --noconfirm docker docker-compose docker-buildx k3d ollama neovim

# 3. Configure zRAM (Crucial for 8GB RAM)
echo -e "[zram0]\nzram-size = ram / 2\ncompression-algorithm = zstd" | sudo tee /etc/systemd/zram-generator.conf
sudo systemctl daemon-reload
sudo systemctl restart systemd-zram-setup@zram0.service

# 4. Configure Docker daemon and permissions
sudo systemctl enable --now docker.service
sudo usermod -aG docker $USER

# 5. Enable Ollama and fetch Hermes 3B model
sudo systemctl enable --now ollama.service
echo "Waiting for Ollama service to start..."
sleep 3
ollama pull hermes3:3b

# 6. Change default shell to Zsh
chsh -s $(which zsh)

echo "Deployment complete! Please reboot to apply Docker and Zsh changes."
